sources:
  - name: jaffle_shop
    description: A clone of the postgres application database
    database: raw  
    schema: jaffle_shop  
    config: 
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 3
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: primary key for orders dta
            data_tests:
              - unique
              - not_null 
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: primary key for customers data
            data_tests:
              - unique
              - not_null 
        freshness: null
        
  - name: stripe
    tables:
      - name: payment
        description: Raw payment data
